services:
  postgres:
    image: postgres:16-alpine
    container_name: vesta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vesta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-vesta}
    ports:
      - "55432:5432"
    volumes:
      - vesta_pg:/var/lib/postgresql/data

volumes:
  vesta_pg:
